name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Generate synthetic test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bash scripts/make_test_media.sh

      - name: End-to-end verification
        run: node dist/verify.js

      - name: Guard coverage — every refusal must actually happen
        run: node dist/guard_coverage.js ./test-media ./out_drafts/guards

      - name: Generate the hands-on verification drafts
        run: node dist/make_verify_drafts.js ./verify-media ./verify-drafts

      - name: Validate the Plugin package
        run: python3 scripts/validate_plugin.py plugin

      - name: Verify the Plugin bundle matches the build output
        run: |
          diff -u dist/server.js plugin/server/server.js
          diff -u dist/draft.js  plugin/server/draft.js

      - name: Check that the Plugin Skill matches the source Skill
        run: diff -u skills/jianying-editor/SKILL.md plugin/skills/jianying-editor/SKILL.md

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          python3 -m pip install --break-system-packages pymediainfo

      - name: Generate synthetic test media
        run: bash scripts/make_test_media.sh

      - name: Clone the reference implementation
        run: |
          git clone --depth 1 https://github.com/luoluoluo22/jianying-editor-skill \
            /tmp/jianying-editor-skill
          echo "JY_UPSTREAM_SKILL=/tmp/jianying-editor-skill" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Differential scenarios against the reference library
        run: node dist/diff_scenarios.js "$JY_UPSTREAM_SKILL" ./test-media ./diff_scenarios

      # The reference classifies a still image as "photo" only when MediaInfo
      # is importable. With MediaInfo present the image classification and
      # duration are compared for real, without the normalisation the
      # fallback environment needs.
      - name: Differential scenarios with MediaInfo (strict image comparison)
        run: |
          JY_UPSTREAM_HAS_MEDIAINFO=1 \
          node dist/diff_scenarios.js "$JY_UPSTREAM_SKILL" ./test-media ./diff_scenarios_mediainfo

      # draft_meta_info.json is the project registry entry. The differential
      # harness fingerprints only draft_info.json, so this file is compared
      # separately against the reference template.
      - name: Compare the registry entry with the reference template
        run: |
          node dist/gen_compare.js ./compare_drafts/mcp
          python3 scripts/compare_meta_info.py ./compare_drafts/mcp/Compare_Mcp
