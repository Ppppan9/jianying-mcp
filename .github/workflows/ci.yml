name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Generate synthetic test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bash scripts/make_test_media.sh

      - name: End-to-end verification
        run: node dist/verify.js

      - name: Guard coverage — every refusal must actually happen
        run: node dist/guard_coverage.js ./test-media ./out_drafts/guards

      - name: Protocol check — a request that arrives must get an answer
        run: node dist/protocol_check.js ./test-media

      - name: Documentation check — the documented calls have to work
        run: node dist/docs_check.js

      - name: Loader check — a hostile draft must not crash the server
        run: node dist/loader_check.js

      - name: Format check — the draft has to match the installed JianYing
        run: node dist/format_check.js

      - name: Generate the hands-on verification drafts
        run: node dist/make_verify_drafts.js ./verify-media ./verify-drafts

      - name: Validate the Plugin package
        run: python3 scripts/validate_plugin.py plugin

      - name: The versions have to agree
        run: python3 scripts/check_version.py

      - name: Verify the Plugin bundle matches the build output
        run: |
          # Syncing first and then checking the working tree catches a stale
          # bundle: if the committed copy differs from what the build
          # produces, the sync changes it and git notices.
          npm run sync-plugin
          git diff --exit-code plugin/
          diff -u dist/server.js plugin/server/server.js
          diff -u dist/draft.js  plugin/server/draft.js
          diff -u dist/schema_validate.js plugin/server/schema_validate.js

      # The bundle is what users actually run. Comparing it with the build
      # output only proves the files match — it does not prove the server
      # starts. A missing module in the bundle is invisible to a diff.
      - name: The bundled Plugin server starts and answers
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node plugin/server/server.js \
            | tee /tmp/plugin-bundle.out \
            | grep -q '"jianying_add_video"' \
            && grep -q '"protocolVersion"' /tmp/plugin-bundle.out

      - name: Check that the Plugin Skill matches the source Skill
        run: diff -u skills/jianying-editor/SKILL.md plugin/skills/jianying-editor/SKILL.md

  # The mutation job deliberately breaks the engine and checks that the
  # suite notices. It is a separate job because it rewrites the source
  # while it runs, and it restores the tree before it finishes.
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate synthetic test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          bash scripts/make_test_media.sh

      # The mutation job rewrites the source while it runs, so it needs its
      # own build. `dist/` is not committed, so without this the script has
      # nothing to run.
      - name: Build
        run: npm run build

      - name: Mutation check — the suite must notice every deliberate break
        run: node dist/mutation_check.js ./test-media

      - name: Confirm the source tree was restored
        run: git diff --exit-code

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          python3 -m pip install --break-system-packages pymediainfo

      - name: Generate synthetic test media
        run: bash scripts/make_test_media.sh

      - name: Clone the reference implementation
        run: |
          git clone --depth 1 https://github.com/luoluoluo22/jianying-editor-skill \
            /tmp/jianying-editor-skill
          echo "JY_UPSTREAM_SKILL=/tmp/jianying-editor-skill" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Differential scenarios against the reference library
        run: node dist/diff_scenarios.js "$JY_UPSTREAM_SKILL" ./test-media ./diff_scenarios

      # The reference classifies a still image as "photo" only when MediaInfo
      # is importable. With MediaInfo present the image classification and
      # duration are compared for real, without the normalisation the
      # fallback environment needs.
      - name: Differential scenarios with MediaInfo (strict image comparison)
        run: |
          JY_UPSTREAM_HAS_MEDIAINFO=1 \
          node dist/diff_scenarios.js "$JY_UPSTREAM_SKILL" ./test-media ./diff_scenarios_mediainfo

      # draft_meta_info.json is the project registry entry. The differential
      # harness fingerprints only draft_info.json, so this file is compared
      # separately against the reference template.
      - name: Compare the registry entry with the reference template
        run: |
          node dist/gen_compare.js ./compare_drafts/mcp
          python3 scripts/compare_meta_info.py ./compare_drafts/mcp/Compare_Mcp
